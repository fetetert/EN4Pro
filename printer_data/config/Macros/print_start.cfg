#############################################################################
#   Print Start Macro
#############################################################################

[gcode_macro PRINT_START]   
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}                                      ; Get Bed Temp from Slicer
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}                           ; Get Extruder Temp from Slicer
    {% set TAP_TEMP = params.TAP_TEMP|default(150)|float %}                                     ; Get Nozzle Tap Temp
    Frame_Light_ON                                                                              ; Call Frame Light Macro
    Part_Light_ON                                                                               ; Call Part Light Macro
    G90                                                                                         ; Use absolute coordinates
#    G92 E0                                                                                      ; Reset Extruder
    BED_MESH_CLEAR                                                                              ; Clear Bed Mesh
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}                                  ; Heat Bed to target temp
    SET_HEATER_TEMPERATURE HEATER=heater_bed_outer TARGET={BED_TEMP}                            ; Heat Outer Bed to target temp
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP-2} MAXIMUM={BED_TEMP+4}                ; Waits until the bed reaches close to target
    G28                                                                                         ; Home All Axis
    Z_TILT_ADJUST                                                                               ; Z tilt adjust
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={TAP_TEMP}                                    ; Heat Nozzle to target tap temp
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TAP_TEMP-5.0} MAXIMUM={TAP_TEMP+5.0}              ; Waits until the nozzle reaches close to target
    SET_Z_FROM_TAP                                                                              ; Set printing Z offset using tap

#    TAP_TO_ADJUST_Z_OFFSET                                                                      ; Set printing Z offset using tap
    BED_MESH_CALIBRATE METHOD=scan ADAPTIVE=1                                                   ; Adaptive Bed Mesh
    G90                                                                                         ; Use absolute coordinates
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}                               ; Set and heat the final extruder temperature
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP-4.0} MAXIMUM={EXTRUDER_TEMP+10.0}   ; Wait for extruder to reach near target temperature
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                                         ; Enable Filament Sensor
    LINE_PURGE                                                                                  ; KAMP Line Purge near print 



    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1 HORIZONTAL_MOVE_Z=1.0                       ; Adaptive Bed Mesh
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}                               ; Set and heat the final extruder temperature
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP-4.0} MAXIMUM={EXTRUDER_TEMP+10.0}   ; Wait for extruder to reach near target temperature
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                                         ; Enable Filament Sensor
    G92 E0                                                                                      ; Reset Extruder
    LINE_PURGE                                                                                  ; KAMP Line Purge near print